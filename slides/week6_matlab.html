<h2 id="exit-ticket---or">Exit Ticket — <code>*</code> or <code>.*</code>?</h2>
<p>Choose the operator for matrix and element-wise products.</p>
<div class="code-examples">
<div class="code-panel">
<p><strong>MATLAB</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-matlab">A = [<span class="hljs-number">1</span> <span class="hljs-number">2</span>; <span class="hljs-number">3</span> <span class="hljs-number">4</span>]; B = [<span class="hljs-number">2</span> <span class="hljs-number">0</span>; <span class="hljs-number">1</span> <span class="hljs-number">2</span>];
u = [<span class="hljs-number">1</span> <span class="hljs-number">2</span> <span class="hljs-number">3</span>]; v = [<span class="hljs-number">4</span> <span class="hljs-number">5</span> <span class="hljs-number">6</span>];
A * B    <span class="hljs-comment">% [4 4; 10 8]</span>
u .* v   <span class="hljs-comment">% [4 10 18]</span>
</code></pre>
</div>
<div class="code-panel">
<p><strong>Python</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np
A=np.array([[<span class="hljs-number">1</span>,<span class="hljs-number">2</span>],[<span class="hljs-number">3</span>,<span class="hljs-number">4</span>]]); B=np.array([[<span class="hljs-number">2</span>,<span class="hljs-number">0</span>],[<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]])
u=np.array([<span class="hljs-number">1</span>,<span class="hljs-number">2</span>,<span class="hljs-number">3</span>]); v=np.array([<span class="hljs-number">4</span>,<span class="hljs-number">5</span>,<span class="hljs-number">6</span>])
A @ B   <span class="hljs-comment"># matrix multiplication</span>
u * v   <span class="hljs-comment"># element-wise multiplication</span>
</code></pre>
</div>
</div>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-matlab"><span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>;

    <span class="hljs-built_in">disp</span>(<span class="hljs-built_in">i</span>^<span class="hljs-number">2</span>)  <span class="hljs-comment">% prints 1, 4, 9</span>
    <span class="hljs-built_in">i</span> = <span class="hljs-built_in">i</span> + <span class="hljs-number">1</span>;
<span class="hljs-keyword">end</span>
