<h3 id="volumetric-data-visualization">Volumetric data visualization</h3>
<p>To visualize volumetric data, we have to combine several Matlab functions together: <code>isosurface</code>, <code>isonormals</code>, <code>isocaps</code>, and <code>patch</code>.</p>
<p>Matlab code:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-matlab">[x,y,z] = <span class="hljs-built_in">meshgrid</span>([-<span class="hljs-built_in">pi</span>:<span class="hljs-number">0.25</span>:<span class="hljs-built_in">pi</span>]);
V = <span class="hljs-built_in">cos</span>(x.*y.*z);
A = (V + <span class="hljs-number">1</span>) / <span class="hljs-number">2</span>;
B = <span class="hljs-number">1.0</span> - A;
visual3d_lyx(A, B, A*<span class="hljs-number">0</span>, [<span class="hljs-number">0.8</span>, <span class="hljs-number">0.55</span>, <span class="hljs-number">0.5</span>], [<span class="hljs-number">0.6</span>, <span class="hljs-number">0.6</span>, <span class="hljs-number">0.6</span>], [<span class="hljs-number">1</span>,<span class="hljs-number">1</span>,<span class="hljs-number">1</span>]);
</code></pre>
<p>Here we use the homemade function <code>visual3d_lyx</code> to do all the visualization. The function is available as a <a href="../scripts/visual3d_lyx.m">Matlab M file</a>.</p>
